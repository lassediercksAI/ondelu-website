server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /privacy → /privacy.html etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Explicit routes
    location = /privacy   { try_files /privacy.html =404; }
    location = /support   { try_files /support.html =404; }
    location = /legal     { try_files /legal.html =404; }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';";

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript;

    error_page 404 /404.html;
}
